<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ground School Topics</title>
  <link rel="icon" type="image/png" href="assets/aoa-logo-source.png" />

  <link rel="stylesheet" href="styles.css" />

  <link rel="stylesheet" href="styles.css" />

  <style>
    :root{
      --panel: rgba(255,255,255,.82);
      --panelBorder: rgba(37,99,235,.14);
      --ok: rgba(34,197,94,.18);
      --okBorder: rgba(34,197,94,.38);
      --bad: rgba(239,68,68,.18);
      --badBorder: rgba(239,68,68,.38);
      --textMain: #0f172a;
      --textSoft: rgba(15,23,42,.72);
      --textSoft2: rgba(15,23,42,.55);
      --cardBg: rgba(255,255,255,.92);
      --cardBorder: rgba(37,99,235,.12);
    }

    .glass-card{
      background: var(--panel);
      border: 1px solid var(--panelBorder);
      box-shadow: 0 10px 30px rgba(15,23,42,.10);
      backdrop-filter: blur(10px);
    }

    .page-shell {
      background:
        linear-gradient(115deg, rgba(186,230,253,.26), transparent 38%),
        linear-gradient(245deg, rgba(147,197,253,.22), transparent 42%),
        #ffffff;
    }

    .sky-wash {
      background:
        radial-gradient(circle at 16% 20%, rgba(191,219,254,.34), transparent 30%),
        radial-gradient(circle at 82% 18%, rgba(125,211,252,.26), transparent 32%),
        radial-gradient(circle at 72% 88%, rgba(219,234,254,.36), transparent 34%);
      animation: skyBreathe 5s ease-in-out infinite;
    }

    .flight-trail {
      position: absolute;
      left: -12%;
      width: 64%;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(147,197,253,.10), rgba(96,165,250,.42), transparent);
      transform: rotate(-12deg);
      opacity: .7;
      animation: trailSweep 7s linear infinite;
    }

    .flight-trail:nth-child(1) { top: 22%; animation-delay: -1s; }
    .flight-trail:nth-child(2) { top: 38%; animation-delay: -4s; width: 48%; opacity: .48; }
    .flight-trail:nth-child(3) { top: 64%; animation-delay: -2.5s; width: 58%; opacity: .38; }

    .card {
      animation: cardRise .72s ease both;
      transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
    }

    .card:nth-child(1) { animation-delay: .1s; }
    .card:nth-child(2) { animation-delay: .2s; }
    .card:nth-child(3) { animation-delay: .3s; }
    .card:nth-child(4) { animation-delay: .4s; }

    .card:hover {
      border-color: rgba(37,99,235,.35);
      box-shadow: 0 18px 42px rgba(37,99,235,.16);
      transform: translateY(-6px) scale(1.01);
    }

    .pill {
      border: 1px solid rgba(37,99,235,.16);
      background: rgba(255,255,255,.85);
      color: var(--textSoft);
    }

    .pill-ok {
      border: 1px solid rgba(34,197,94,.32);
      background: rgba(34,197,94,.14);
      color: var(--textMain);
    }

    .mono { font-variant-numeric: tabular-nums; }

    .brand-logo {
      width: clamp(120px, 18vw, 240px);
      max-height: 88px;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(15,23,42,.14));
    }

    .headline-pop {
      background: linear-gradient(90deg, #1e3a8a, #2563eb, #eab308, #1e3a8a);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: headlineSweep 5s ease-in-out infinite;
    }

    .today-badge {
      border: 1px solid rgba(37,99,235,.12);
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      box-shadow: 0 8px 24px rgba(15,23,42,.08);
      padding: .35rem .75rem;
      animation: badgePulse 3.5s ease-in-out infinite;
    }

    .c172-flyby {
      position: fixed;
      right: 0;
      bottom: clamp(10px, 2.5vh, 28px);
      z-index: 20;
      width: clamp(230px, 30vw, 460px);
      pointer-events: none;
      opacity: .9;
      transform: translateX(0);
      animation: c172Travel 8s linear infinite;
    }

    .c172-plane {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 12px 18px rgba(15,23,42,.22));
      transform-origin: 50% 55%;
      animation: c172Bob 2.8s ease-in-out infinite;
    }

    .header-grid {
      display: grid;
      grid-template-columns: minmax(160px, 1fr) auto minmax(160px, 1fr);
      align-items: center;
      gap: 1rem;
      min-height: 96px;
    }

    .header-logo-wrap {
      display: flex;
      justify-content: flex-end;
    }

    @media (max-width: 640px) {
      .header-grid {
        grid-template-columns: 1fr;
        justify-items: center;
        min-height: 0;
      }

      .header-logo-wrap {
        justify-content: center;
      }
    }

    @keyframes skyBreathe {
      0%, 100% {
        opacity: .72;
        transform: translate3d(-1%, -.6%, 0) scale(1.02);
      }

      50% {
        opacity: 1;
        transform: translate3d(1%, .8%, 0) scale(1.08);
      }
    }

    @keyframes trailSweep {
      from { transform: translateX(-35%) rotate(-12deg); }
      to { transform: translateX(235%) rotate(-12deg); }
    }

    @keyframes cardRise {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes headlineSweep {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes badgePulse {
      0%, 100% { transform: translateY(0); box-shadow: 0 8px 24px rgba(15,23,42,.08); }
      50% { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(37,99,235,.14); }
    }

    @keyframes c172Travel {
      from { transform: translateX(120%); }
      to { transform: translateX(calc(-100vw - 120%)); }
    }

    @keyframes c172Bob {
      0%, 100% { transform: translateY(0) rotate(.4deg); }
      25% { transform: translateY(-8px) rotate(1.8deg); }
      50% { transform: translateY(0) rotate(.2deg); }
      75% { transform: translateY(8px) rotate(-1.8deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

    ::-webkit-scrollbar { height: 10px; width: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(37,99,235,.18); border-radius: 999px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,.35); }
  </style>

</head>

<body class="font-sans min-h-screen bg-white text-slate-900">

      <span class="flight-trail"></span>

      <main class="relative z-10 grid gap-4 md:grid-cols-2 xl:grid-cols-4">

  <section id="card-instrument" class="card glass-card p-5 rounded-2xl"></section>

      <div class="c172-flyby" aria-hidden="true">
        <svg class="c172-plane" viewBox="0 0 620 180" role="img" aria-label="Airplane silhouette">
          <path d="M73 101h203L382 30c13-8 29 5 23 20l-28 51h103l54-43c11-9 28 1 25 16l-8 27h34c18 0 32 14 32 32s-14 32-32 32H65c-15 0-28-12-28-28 0-20 16-36 36-36Z" fill="#f8fafc" stroke="#1e3a8a" stroke-width="8" stroke-linejoin="round"/>
          <path d="M132 101 78 56c-10-8-24 1-21 14l9 31m231 0 80 58c14 10 32-5 24-21l-20-37" fill="#dbeafe" stroke="#2563eb" stroke-width="7" stroke-linejoin="round"/>
          <path d="M484 101h101c18 0 32 14 32 32s-14 32-32 32H371" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="8" stroke-linejoin="round"/>
          <circle cx="503" cy="165" r="10" fill="#0f172a"/>
          <circle cx="176" cy="165" r="10" fill="#0f172a"/>
          <path d="M426 71h84" stroke="#eab308" stroke-width="8" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>

<script>
/* =========================================
   EDIT TOPICS HERE
   Days: 0=Sun ... 6=Sat
   ========================================= */

const SCHEDULE = {
  Private: {
    days: [0,1,2,3,4,5,6],
    topics: [
      "Student Pilot Documents",
      "Aircraft Documents-Inspections",
      "Preflight Aircraft Inspection",
      "Checklist Usage Sterile Cockpit",
      "Passenger Safety Briefing",
      "Primary Flight Controls",
      "Secondary Flight Controls",
      "Powerplant Engines",
      "Ignition Magneto",
      "Fuel System",
      "Electrical System",
      "Landing Gear Brakes Pressurization Oxygen",
      "Runway Incursions",
      "Radio Communications - Cockpit Management",
      "Lift Turns",
      "Drag Ground Effect",
      "Wake Turbulence",
      "Stalls and Spins",
      "Weight and Balance",
      "Thrust Propeller",
      "Density Altitude",
      "Airplane Performance",
      "Pitot-Static Flight Instruments",
      "Gyroscopic Flight Instruments",
      "Taxi Procedures",
      "Airspace Classifications",
      "Collision Avoidance",
      "Forced Landing",
      "Night Operations",
      "Inoperative Equipment",
      "Maneuvering Speed"
    ]
  },

  Instrument: {
    days: [2,3,4,5,6], // Tue-Sat
    topics: [
      "Spatial Disorientation",
      "Attitude Instrument Flying EFD",
      "Flying Partial Panel",
      "Preparing for the Approach",
      "Alternate Airports",
      "VORs How It Works",
      "VOR Tracking",
      "GPS How It Works",
      "GPS Approaches",
      "Holding Patterns",
      "ILS Approaches",
      "Circling to Land"
    ]
  },

  Commercial: {
    days: [2,4,6], // Tue/Thu/Sat
    topics: [
      "Privileges and Limitations, Commercial Regulations",
      "MELs, Getting an MEL, Ferry Permits",
      "High Altitude Systems",
      "Constant Speed Props and Propeller Principals, Turbines",
      "Control Surfaces and Their Varieties",
      "L/D Coefficient, Range and Endurance",
      "Stalls and Spins, T-tails and Deep Stalls",
      "Effects of Wing Planform and Wing Design",
      "Critical Mach Number, Mach Tuck, Transonic Aerodynamics",
      "CG, Stability, Weight Shift Formula",
      "Traversing Complex Airspace",
      "Risk Management and ADM In Commercial Operations"
    ]
  },

  Written: {
    days: [2,3,4,5,6], // Tue/Wed/Thu/Fri/Sat
    trackByDay: {
      2: "PVT",
      3: "IRA",
      4: "PVT",
      5: "IRA",
      6: "PVT"
    },
    topics: {
      PVT: ["PVT Knowledge Test Prep"],
      IRA: ["IRA Knowledge Test Prep"]
    }
  }
};

/* =========================================
   TOPIC 1 START DATES
   These make 3/17/2026 line up as:
   Private = Runway Incursions
   Instrument = Holding Patterns
   Commercial = High Altitude Systems
   ========================================= */

const START_DATES = {
  Private: "2026-03-05",
  Instrument: "2026-02-27",
  Commercial: "2026-03-12",
  Written: "2026-03-17"
};

/* =========================================
   ENGINE
   ========================================= */

const weekdays = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const pad2 = (n) => String(n).padStart(2, "0");

function toYMD(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function parseYMD(ymd) {
  const [y, m, d] = ymd.split("-").map(Number);
  return new Date(y, m - 1, d, 0, 0, 0, 0);
}

function addDays(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}

function isMeetingDay(days, dateObj) {
  return days.includes(dateObj.getDay());
}

function countMeetingsInclusive(anchor, target, days) {
  if (target < anchor) return 0;

  let count = 0;
  let d = new Date(anchor);

  while (d <= target) {
    if (isMeetingDay(days, d)) count++;
    d = addDays(d, 1);
  }

  return count;
}

function topicForDate(startDate, dateObj, rating) {
  if (!isMeetingDay(rating.days, dateObj)) return null;

  if (rating.trackByDay && rating.topics && !Array.isArray(rating.topics)) {
    const day = dateObj.getDay();
    const track = rating.trackByDay[day];
    const list = rating.topics[track] || [];
    if (!list.length) return null;

    const n = countMeetingsInclusive(startDate, dateObj, rating.days);
    if (n <= 0) return null;

    return list[(n - 1) % list.length];
  }

  const n = countMeetingsInclusive(startDate, dateObj, rating.days);
  const list = rating.topics || [];

  if (!list.length || n <= 0) return null;
  return list[(n - 1) % list.length];
}

function nextMeetings(fromDate, rating, howMany = 4) {
  const out = [];
  let d = new Date(fromDate);

  for (let i = 0; i < 42 && out.length < howMany; i++) {
    if (isMeetingDay(rating.days, d)) out.push(new Date(d));
    d = addDays(d, 1);
  }

  return out;
}

function meetsLabel(days) {
  return days.map(d => weekdays[d].slice(0, 3)).join(", ");
}

function escapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

// Auto refresh every 2 hours (2 * 60 * 60 * 1000 ms)
setInterval(() => {
  location.reload();
}, 7200000);
/* =========================================
   UI
   ========================================= */

function pillForToday(rating, today) {
  if (isMeetingDay(rating.days, today)) {
    return `<span class="pill pill-ok text-xs px-3 py-1 rounded-full">Meets today</span>`;
  }
  return `<span class="pill text-xs px-3 py-1 rounded-full">No class today</span>`;
}

function renderCard(elId, title, rating, today, startDateYMD) {
  const el = document.getElementById(elId);
  const startDate = parseYMD(startDateYMD);

  const todayTopic = topicForDate(startDate, today, rating);

  const upcomingDates = nextMeetings(addDays(today, 1), rating, 4);
  const upcomingLines = upcomingDates.map(d => {
    const t = topicForDate(startDate, d, rating);
    return `
      <div class="mt-2">
        <div class="text-xs mono" style="color: var(--textSoft);">
          ${weekdays[d.getDay()]} • ${toYMD(d)}
        </div>
        <div class="text-sm font-semibold text-slate-900">${escapeHtml(t || "—")}</div>
      </div>
    `;
  }).join("");

  el.innerHTML = `
    <div class="flex items-center justify-between gap-2">
<h2 class="text-xl font-extrabold text-slate-900">${escapeHtml(title)}</h2>
    </div>

    <div class="mt-1">
      <div class="text-xs uppercase tracking-wider" style="color: var(--textSoft);">
        Meets: ${escapeHtml(meetsLabel(rating.days))}
      </div>
    </div>

    <div class="mt-1 text-xs mono" style="color: var(--textSoft2);">
      Topic 1 date: ${escapeHtml(startDateYMD)}
    </div>

    <div class="mt-4">
      <div class="text-xs uppercase tracking-wider" style="color: var(--textSoft);">Today</div>
      ${
        isMeetingDay(rating.days, today)
          ? `<div class="mt-1 text-base font-extrabold text-sim-blue">${escapeHtml(todayTopic || "—")}</div>`
          : `<div class="mt-1 text-sm font-semibold" style="color: var(--textSoft);">No scheduled session</div>`
      }
    </div>

    <div class="mt-4 rounded-xl p-3"
      style="background: var(--cardBg); border: 1px solid var(--cardBorder);">
      <div class="text-xs uppercase tracking-wider" style="color: var(--textSoft);">Next 4 sessions</div>
      ${upcomingLines || `<div class="mt-2 text-sm" style="color: var(--textSoft);">No upcoming sessions found.</div>`}
    </div>
  `;
}

function render() {
  const today = new Date();
  document.getElementById("todayLine").textContent = `${weekdays[today.getDay()]} • ${toYMD(today)}`;

  renderCard("card-private", "Private 2-4 PM", SCHEDULE.Private, today, START_DATES.Private);
  renderCard("card-instrument", "Instrument 12-2 PM", SCHEDULE.Instrument, today, START_DATES.Instrument);
  renderCard("card-commercial", "Commercial 4-6 PM", SCHEDULE.Commercial, today, START_DATES.Commercial);
  renderCard("card-written", "Knowledge Test Prep 10-12 PM", SCHEDULE.Written, today, START_DATES.Written);
}

function initAnimationSync() {
  const now = new Date();
  const midnight = new Date(now);
  midnight.setUTCHours(0, 0, 0, 0);
  const elapsedMs = now.getTime() - midnight.getTime();

  const skyWash = document.querySelector('.sky-wash');
  if (skyWash) {
    const skyOffset = (elapsedMs % 5000) / 5000 * -5;
    skyWash.style.animationDelay = `${skyOffset}s`;
  }

  const trails = document.querySelectorAll('.flight-trail');
  trails.forEach((trail) => {
    const trailDuration = 7000;
    const offset = (elapsedMs % trailDuration) / trailDuration * -7;
    trail.style.animationDelay = `${offset}s`;
  });

  const c172 = document.querySelector('.c172-flyby');
  if (c172) {
    const c172Duration = 8000;
    const planeOffset = (elapsedMs % c172Duration) / c172Duration * -8;
    c172.style.animationDelay = `${planeOffset}s`;

    const planeImg = document.querySelector('.c172-plane');
    if (planeImg) {
      const bobDuration = 2800;
      const bobOffset = (elapsedMs % bobDuration) / bobDuration * -2.8;
      planeImg.style.animationDelay = `${bobOffset}s`;
    }
  }

  console.log(`Animation sync initialized at ${elapsedMs}ms from midnight UTC`);
}

render();
initAnimationSync();
setInterval(initAnimationSync, 30000);
</script>
